name: Build Sadhana Seva APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "KEYSTORE_SOURCE=repo (Firebase-registered)" >> "$GITHUB_ENV"
          elif [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "KEYSTORE_SOURCE=github-secret (Firebase-registered)" >> "$GITHUB_ENV"
          else
            echo "debug.keystore.base64 not found in repo; generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_SOURCE=generated-fallback (add SHA-1 below to Firebase Console for Google Sign-In)" >> "$GITHUB_ENV"
          fi

          SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:" | awk '{print $2}')
          SHA256=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA256:" | awk '{print $2}')
          {
            echo "### Signing Keystore Info"
            echo "- **Source**: $KEYSTORE_SOURCE"
            echo "- **SHA-1**: \`$SHA1\`"
            echo "- **SHA-256**: \`$SHA256\`"
            if [ -f app/google-services.json ]; then
              echo "- **google-services.json**: Present"
            else
              echo "- **google-services.json**: Missing (Firebase Sign-In will require adding google-services.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Report build error summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build Failure Tail"
            echo '```text'
            tail -n 60 /tmp/gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK for easy sharing
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SadhanaSeva.apk

      - name: Upload SadhanaSeva.apk
        uses: actions/upload-artifact@v4
        with:
          name: SadhanaSeva-APK
          path: dist/SadhanaSeva.apk
          retention-days: 90
