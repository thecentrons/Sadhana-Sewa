name: Build Sadhana Seva APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase google-services.json
        shell: bash
        env:
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$SECRET_GOOGLE_SERVICES_JSON" ]; then
            # Accept either raw JSON (starts with '{') or base64-encoded JSON
            TRIMMED=$(printf '%s' "$SECRET_GOOGLE_SERVICES_JSON" | tr -d '[:space:]')
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$SECRET_GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$TRIMMED" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
          else
            {
              echo "### Missing Firebase Configuration (app/google-services.json)"
              echo "AI Studio excludes \`app/google-services.json\` when pushing to GitHub."
              echo ""
              echo "**Fix (takes 30 seconds):**"
              echo "1. Open your project in Firebase Console -> Project Settings -> Download \`google-services.json\` (or copy it from \`app/google-services.json\` in AI Studio's code editor)."
              echo "2. In GitHub, go to **Settings -> Secrets and variables -> Actions -> New repository secret**."
              echo "3. Name: \`GOOGLE_SERVICES_JSON\` and paste the entire JSON content as the value."
              echo "4. Re-run this workflow!"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: app/google-services.json is missing. Add GitHub Secret GOOGLE_SERVICES_JSON and re-run."
            exit 1
          fi

      - name: Prepare signing keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "KEYSTORE_SOURCE=repo (Firebase-registered)" >> "$GITHUB_ENV"
          elif [ -n "$SECRET_KEYSTORE_B64" ]; then
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "KEYSTORE_SOURCE=github-secret (Firebase-registered)" >> "$GITHUB_ENV"
          else
            echo "debug.keystore.base64 not found; generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_SOURCE=generated-fallback (add SHA-1 below to Firebase Console for Google Sign-In)" >> "$GITHUB_ENV"
          fi

          SHA1=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:" | awk '{print $2}')
          SHA256=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA256:" | awk '{print $2}')
          {
            echo "### Build & Signing Info"
            echo "- **google-services.json**: Present"
            echo "- **Keystore Source**: $KEYSTORE_SOURCE"
            echo "- **SHA-1**: \`$SHA1\`"
            echo "- **SHA-256**: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Report build error summary on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build Failure Tail"
            echo '```text'
            tail -n 60 /tmp/gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK for easy sharing
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SadhanaSeva.apk

      - name: Upload SadhanaSeva.apk
        uses: actions/upload-artifact@v4
        with:
          name: SadhanaSeva-APK
          path: dist/SadhanaSeva.apk
          retention-days: 90
