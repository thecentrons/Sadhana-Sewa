name: Build Sadhana Seva APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36.1" "platform-tools" >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase google-services.json
        shell: bash
        env:
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$SECRET_GOOGLE_SERVICES_JSON" ]; then
            # Accept either raw JSON (starts with '{') or base64-encoded JSON
            TRIMMED=$(printf '%s' "$SECRET_GOOGLE_SERVICES_JSON" | tr -d '[:space:]')
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s\n' "$SECRET_GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$TRIMMED" | base64 -d > app/google-services.json
            fi
            echo "Restored app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
          else
            {
              echo "### Missing Firebase Configuration (app/google-services.json)"
              echo "AI Studio excludes \`app/google-services.json\` when pushing to GitHub."
              echo ""
              echo "**Fix (takes 30 seconds):**"
              echo "1. Open \`app/google-services.json\` in AI Studio's code editor and copy the ENTIRE file (from \`{\` to \`}\`)."
              echo "2. In GitHub, go to **Settings -> Secrets and variables -> Actions**."
              echo "3. Under **Repository secrets** (NOT Environment secrets), click **New repository secret**."
              echo "4. Exact Name: \`GOOGLE_SERVICES_JSON\` and paste the JSON content as the value."
              echo "5. Re-run this workflow!"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: app/google-services.json is missing. Add GitHub Secret GOOGLE_SERVICES_JSON and re-run."
            exit 1
          fi

          if ! python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
            {
              echo "### Invalid GOOGLE_SERVICES_JSON Secret"
              echo "The \`GOOGLE_SERVICES_JSON\` secret does not contain valid JSON."
              echo "Please copy the ENTIRE contents of \`app/google-services.json\` (starting with \`{\` and ending with \`}\`) into the \`GOOGLE_SERVICES_JSON\` repository secret and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: app/google-services.json is not valid JSON."
            exit 1
          fi

      - name: Prepare signing keystore
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_SOURCE=""
          KEYSTORE_WARNING=""

          if [ -f debug.keystore.base64 ]; then
            if tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null \
               && keytool -list -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android >/dev/null 2>&1; then
              KEYSTORE_SOURCE="repo debug.keystore.base64 (Firebase-registered)"
            else
              rm -f debug.keystore
              KEYSTORE_WARNING="debug.keystore.base64 in repo was not a valid keystore; generated fallback."
            fi
          elif [ -n "$SECRET_KEYSTORE_B64" ]; then
            if printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore 2>/dev/null \
               && keytool -list -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android >/dev/null 2>&1; then
              KEYSTORE_SOURCE="GitHub Secret DEBUG_KEYSTORE_BASE64 (Firebase-registered)"
            else
              rm -f debug.keystore
              KEYSTORE_WARNING="Your DEBUG_KEYSTORE_BASE64 secret was not valid base64 keystore data (please copy ONLY the contents of debug.keystore.base64). Used a freshly generated keystore so the APK still builds!"
            fi
          fi

          if [ -z "$KEYSTORE_SOURCE" ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KEYSTORE_SOURCE="generated-fallback (add SHA-1 below to Firebase Console for Google Sign-In, or fix DEBUG_KEYSTORE_BASE64 secret)"
          fi

          KEYTOOL_OUT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null || true)
          SHA1=$(printf '%s\n' "$KEYTOOL_OUT" | grep -E "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | grep -E "SHA256:" | head -n 1 | awk '{print $2}')
          {
            echo "### Build & Signing Info"
            echo "- **google-services.json**: Valid JSON"
            echo "- **Keystore Source**: $KEYSTORE_SOURCE"
            if [ -n "$KEYSTORE_WARNING" ]; then
              echo "- **Warning**: $KEYSTORE_WARNING"
            fi
            echo "- **SHA-1**: \`$SHA1\`"
            echo "- **SHA-256**: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Report build error summary on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/gradle-build.log ]; then
            {
              echo "### Gradle Build Failure Tail"
              echo '```text'
              tail -n 60 /tmp/gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rename APK for easy sharing
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SadhanaSeva.apk

      - name: Upload SadhanaSeva.apk
        uses: actions/upload-artifact@v4
        with:
          name: SadhanaSeva-APK
          path: dist/SadhanaSeva.apk
          retention-days: 90
