name: Build Sadhana Seva APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode Firebase-registered debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "ERROR: debug.keystore.base64 not found in repository."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for easy sharing
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SadhanaSeva.apk

      - name: Upload SadhanaSeva.apk
        uses: actions/upload-artifact@v4
        with:
          name: SadhanaSeva-APK
          path: dist/SadhanaSeva.apk
          retention-days: 90
